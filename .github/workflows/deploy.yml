name: Deploy site pe GitHub Pages

# Publică automat site-ul la fiecare push pe `main`.
# Poate fi rulat și manual din tab-ul Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisiuni necesare pentru deploy-ul pe Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un singur deploy concurent; nu anulăm un deploy în curs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Activează Pages automat la prima rulare, dacă nu e deja pornit
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicăm întreg repo-ul (site static, fără build)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
