<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EU Funds Command Center — Radar Fonduri Europene</title>
<meta name="description" content="Dashboard operațional pentru consultanță în fonduri europene: radar de apeluri, matching client×apel, pipeline proiecte, calendar de termene și memo-uri GO/NO-GO. Funcționează offline, pe orice dispozitiv.">
<meta name="author" content="Platformă consultanță fonduri europene">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e1726" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

<!-- PWA / instalare pe dispozitiv -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EU Funds CC">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="EU Funds Command Center — Radar Fonduri Europene">
<meta property="og:description" content="Radar de apeluri, matching, pipeline și calendar de termene pentru consultanță în fonduri europene.">
<meta property="og:image" content="icons/icon-512.png">
<meta name="twitter:card" content="summary">

<!-- Setează tema devreme pentru a evita flash-ul (app.js o re-aplică consistent) -->
<script>
  try {
    var t = localStorage.getItem("eufcc_theme") || (matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>

<!-- Tipografie (Inter) — fallback pe fontul de sistem dacă e offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/zone-azi.css">
<link rel="stylesheet" href="assets/zone-apeluri.css">
<link rel="stylesheet" href="assets/zone-clienti.css">
<link rel="stylesheet" href="assets/zone-proiecte.css">
<link rel="stylesheet" href="assets/zone-instrumente.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="#fff" stroke="none"/><path d="M12 6a6 6 0 0 1 6 6" stroke-width="3" opacity=".55"/></svg></span>
      <span><span>EU Funds Command Center</span><small id="firmName"></small></span>
    </div>
    <div class="searchwrap">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="globalSearch" class="search" type="text" placeholder="Caută apeluri, clienți, proiecte…" autocomplete="off">
      <span class="kbd">Ctrl K</span>
      <div id="searchHits" class="searchhits"></div>
    </div>
    <div class="topbtns">
      <div class="tstamp" id="stampBox"></div>
      <button class="btn ib" id="btnTheme" title="Comută dark/light" aria-label="Comută tema"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c-4.97 0-9-4.03-9-9Z"/></svg></button>
      <button class="btn ib" id="btnPrint" title="Printează vederea curentă" aria-label="Printează"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg></button>
      <button class="btn primary" id="btnRescan" title="Cum actualizezi datele"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg><span class="lbl">Actualizare</span></button>
    </div>
  </header>
  <aside class="side">
    <ul class="navi" id="nav"></ul>
    <div class="sidefoot">AI pregătește; <b>omul decide</b>.<br>Nimic nu pleacă spre AM/client fără validare umană.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigare"></nav>
<div class="sheet" id="moreSheet"><div class="bg" onclick="sheetClose()"></div><div class="pane"><div class="grab"></div><div class="sg" id="sheetGrid"></div></div></div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<!-- Stratul de date (se actualizează frecvent) apoi logica aplicației -->
<script src="assets/data.js"></script>
<script src="assets/core.js"></script>
<script src="assets/zone-azi.js"></script>
<script src="assets/zone-apeluri.js"></script>
<script src="assets/zone-clienti.js"></script>
<script src="assets/zone-proiecte.js"></script>
<script src="assets/zone-instrumente.js"></script>
<script src="assets/chat.js"></script>
<script src="assets/evaluator.js"></script>
<script src="assets/boot.js"></script>

<!-- Înregistrare service worker pentru funcționare offline -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
