<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EU Funds Command Center — Radar Fonduri Europene</title>
<meta name="description" content="Dashboard operațional pentru consultanță în fonduri europene: radar de apeluri, matching client×apel, pipeline proiecte, calendar de termene și memo-uri GO/NO-GO. Funcționează offline, pe orice dispozitiv.">
<meta name="author" content="Platformă consultanță fonduri europene">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2a78d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

<!-- PWA / instalare pe dispozitiv -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EU Funds CC">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="EU Funds Command Center — Radar Fonduri Europene">
<meta property="og:description" content="Radar de apeluri, matching, pipeline și calendar de termene pentru consultanță în fonduri europene.">
<meta property="og:image" content="icons/icon-512.png">
<meta name="twitter:card" content="summary">

<!-- Setează tema devreme pentru a evita flash-ul (app.js o re-aplică consistent) -->
<script>
  try {
    var t = matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo"><span class="dot"></span><span>EU Funds Command Center<small id="firmName"></small></span></div>
    <div class="searchwrap">
      <input id="globalSearch" class="search" type="text" placeholder="Caută apeluri, clienți, proiecte…  (Ctrl+K)" autocomplete="off">
      <div id="searchHits" class="searchhits"></div>
    </div>
    <div class="topbtns">
      <div class="tstamp" id="stampBox"></div>
      <button class="btn small" id="btnTheme" title="Comută dark/light">◐</button>
      <button class="btn small" id="btnPrint" title="Printează vederea curentă">🖨</button>
      <button class="btn small primary" id="btnRescan" title="Cum actualizezi datele">⟳ Actualizare</button>
    </div>
  </header>
  <aside class="side">
    <ul class="navi" id="nav"></ul>
    <div class="sidefoot">AI pregătește; <b>omul decide</b>.<br>Nimic nu pleacă spre AM/client fără validare umană.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<!-- Stratul de date (se actualizează frecvent) apoi logica aplicației -->
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>

<!-- Înregistrare service worker pentru funcționare offline -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
